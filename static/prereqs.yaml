AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Portfolio Advisor Workshop prerequisites — Cognito, Lambda functions, VPC, and SSM parameters'
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Cognito Configuration
        Parameters:
          - UserPoolName
          - MachineAppClientName
          - WebAppClientName

Parameters:

  UserPoolName:
    Type: String
    Default: 'PortfolioAdvisorGatewayPool'
    Description: 'Name of the Cognito User Pool'
  
  MachineAppClientName:
    Type: String
    Default: 'PortfolioAdvisorMachineClient'
    Description: 'Name of the Cognito User Pool Application Client'
  
  WebAppClientName:
    Type: String
    Default: 'PortfolioAdvisorWebClient'
    Description: 'Name of the Cognito User Pool Web Application Client'

Resources:

  # ============================================================
  # Cognito Resources
  # ============================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref UserPoolName
      MfaConfiguration: 'OFF'
      UsernameConfiguration:
        CaseSensitive: false
      UsernameAttributes:
        - email  # <--- Use email as username
      AutoVerifiedAttributes:
        - email  # <--- Auto-verify email if you want to skip confirmation step
      # LambdaConfig:
      #   PostConfirmation: !GetAtt PostSignupFunction.Arn
  
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Administrator group
      UserPoolId: !Ref UserPool
      Precedence: 1  # Higher priority (lower number = higher precedence)

  CustomerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: customer
      Description: Regular customer group
      UserPoolId: !Ref UserPool
      Precedence: 2

  WebUserPoolClient:
    DependsOn: ResourceServer
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Ref WebAppClientName
      UserPoolId: !Ref UserPool
      GenerateSecret: false  # Don't use secret for SPA or web apps
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - !Join
            - ''
            - - 'default-m2m-resource-server-'
              - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
              - '/read'
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - http://localhost:8501/
        - https://example.com/auth/callback
      LogoutURLs:
        - http://localhost:8501/
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true

  MachineUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: !Ref MachineAppClientName
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      RefreshTokenValidity: 1
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - !Join
          - ''
          - - 'default-m2m-resource-server-'
            - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
            - '/read'
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO
      EnableTokenRevocation: true
  
  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !Join
        - '-'
        - - 'default-m2m-resource-server'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Name: !Join
        - '-'
        - - 'Default M2M Resource Server '
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Scopes:
        - ScopeName: 'read'
          ScopeDescription: 'An example scope created by Amazon Cognito quick start'
  
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Join
        - ''
        - - !Ref 'AWS::Region'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
  
  PostSignupFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowBasicLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
        - PolicyName: Cognito
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminAddUserToGroup
                Resource: "*"

  PostSignupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Runtime: python3.13
      Role: !GetAtt PostSignupFunctionRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import boto3

          def lambda_handler(event, context):
              user_pool_id = event['userPoolId']
              username = event['userName']
              client = boto3.client('cognito-idp')

              # Add user to 'customer' group
              try:
                  client.admin_add_user_to_group(
                      UserPoolId=user_pool_id,
                      Username=username,
                      GroupName='Customer'
                  )
                  print(f"User {username} added to 'customer' group.")
              except Exception as e:
                  print(f"Error adding user to group: {e}")

              return event

  # ============================================================
  # Workshop Test User — used in Lab 3 (Security) and beyond
  # ============================================================

  CreateUserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: workshop-create-cognito-user
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt CreateUserFunctionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              try:
                  client = boto3.client('cognito-idp')
                  pool_id = os.environ['USER_POOL_ID']
                  email = event['ResourceProperties']['Email']
                  password = event['ResourceProperties']['Password']
                  group = event['ResourceProperties'].get('Group', '')

                  # Create user with permanent password
                  client.admin_create_user(
                      UserPoolId=pool_id,
                      Username=email,
                      UserAttributes=[
                          {'Name': 'email', 'Value': email},
                          {'Name': 'email_verified', 'Value': 'true'},
                      ],
                      MessageAction='SUPPRESS',
                      TemporaryPassword=password,
                  )
                  # Set permanent password
                  client.admin_set_user_password(
                      UserPoolId=pool_id,
                      Username=email,
                      Password=password,
                      Permanent=True,
                  )
                  # Add to group if specified
                  if group:
                      client.admin_add_user_to_group(
                          UserPoolId=pool_id,
                          Username=email,
                          GroupName=group,
                      )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Username': email})
              except client.exceptions.UsernameExistsException:
                  # User already exists — treat as success
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Username': email})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  CreateUserFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CognitoUserManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminAddUserToGroup
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

  WorkshopUser:
    Type: Custom::CognitoUser
    DependsOn:
      - CustomerGroup
      - WebUserPoolClient
    Properties:
      ServiceToken: !GetAtt CreateUserFunction.Arn
      Email: workshopuser@example.com
      Password: 'WorkshopPass1!'
      Group: customer

  # ============================================================
  # Bedrock model subscription (provision-time, account-wide)
  #
  # The agent runs in AgentCore Runtime under a least-privilege
  # execution role with no aws-marketplace:Subscribe/ViewSubscriptions.
  # The first invoke of a third-party serverless model (Claude) would
  # otherwise trigger a Marketplace auto-subscribe using that role and
  # fail with AccessDeniedException. We subscribe the account here, at
  # provision time, with a role that DOES have marketplace permissions,
  # so the model agreement exists before any participant invokes and the
  # runtime role only needs bedrock:InvokeModel*. Subscription is
  # account-wide and idempotent.
  # ============================================================

  ModelSubscribeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockModelSubscription
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:GetFoundationModelAvailability
                  - bedrock:ListFoundationModelAgreementOffers
                  - bedrock:CreateFoundationModelAgreement
                  - bedrock:GetUseCaseForModelAccess
                  - bedrock:PutUseCaseForModelAccess
                Resource: "*"
              - Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                Resource: "*"
              - Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                Resource: "*"
                Condition:
                  ForAnyValue:StringEquals:
                    aws-marketplace:ProductId:
                      - prod-mxcfnwvpd6kb4 # Anthropic Claude Sonnet 4.5
                      - prod-ffvjxvh4ltq64 # Anthropic Claude Sonnet 4.6
                      - prod-xdkflymybwmvi # Anthropic Claude Haiku 4.5
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

  ModelSubscribeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: workshop-bedrock-model-subscribe
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt ModelSubscribeFunctionRole.Arn
      Timeout: 300
      Environment:
        Variables:
          # Base foundation-model IDs to subscribe (region = stack region).
          MODEL_IDS: "anthropic.claude-sonnet-4-5-20250929-v1:0,anthropic.claude-haiku-4-5-20251001-v1:0,anthropic.claude-sonnet-4-6"
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os
          import time

          MODELS = [m.strip() for m in os.environ.get('MODEL_IDS', '').split(',') if m.strip()]

          def ensure(client, model_id):
              avail = client.get_foundation_model_availability(modelId=model_id)
              if avail.get('agreementAvailability', {}).get('status') == 'AVAILABLE':
                  return 'already-available'
              offers = client.list_foundation_model_agreement_offers(modelId=model_id).get('offers', [])
              if not offers:
                  return 'no-offer-skipped'
              client.create_foundation_model_agreement(
                  modelId=model_id, offerToken=offers[0]['offerToken'])
              return 'agreement-created'

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              results = {}
              try:
                  client = boto3.client('bedrock')
                  for m in MODELS:
                      try:
                          results[m] = ensure(client, m)
                      except Exception as e:
                          results[m] = 'error: ' + str(e)
                  # Poll until agreements finish activating (bounded by timeout).
                  deadline = time.time() + 200
                  pending = list(MODELS)
                  while pending and time.time() < deadline:
                      still = []
                      for m in pending:
                          try:
                              st = client.get_foundation_model_availability(
                                  modelId=m).get('agreementAvailability', {}).get('status')
                              if st != 'AVAILABLE':
                                  still.append(m)
                          except Exception:
                              pass
                      pending = still
                      if pending:
                          time.sleep(15)
                  results['pending'] = ','.join(pending) if pending else 'none'
                  print('model subscription results:', results)
              except Exception as e:
                  # Do not block account provisioning on a subscription hiccup;
                  # the devbox pre-subscribe and first-invoke remain as fallbacks.
                  results['fatal'] = str(e)
                  print('model subscription fatal error:', e)
              cfnresponse.send(event, context, cfnresponse.SUCCESS, results)

  BedrockModelSubscription:
    Type: Custom::BedrockModelSubscription
    Properties:
      ServiceToken: !GetAtt ModelSubscribeFunction.Arn
      # Bump this value to force the subscription check to re-run on stack update.
      Version: '1'

  # ============================================================
  # Portfolio Risk Check Lambda Function (used in Lab 2 — Gateway)
  # ============================================================

  PortfolioRiskLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: workshop-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PortfolioRiskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: workshop-check-portfolio-risk
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt PortfolioRiskLambdaRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import json

          PORTFOLIOS = {
              "PORT-001": {
                  "name": "Conservative Income",
                  "strategy": "conservative",
                  "total_value": 500000,
                  "risk_score": 2.1,
                  "holdings": {"UNH": 21, "V": 20, "JPM": 17, "BRK-B": 22, "MSFT": 9, "CASH": 11},
                  "diversification_rating": "Excellent",
                  "recommendation": "Well-diversified with strong income focus. Consider rebalancing CASH into short-term bonds for yield.",
              },
              "PORT-002": {
                  "name": "Growth Technology",
                  "strategy": "aggressive",
                  "total_value": 750000,
                  "risk_score": 7.8,
                  "holdings": {"AAPL": 13, "MSFT": 23, "AMZN": 15, "TSLA": 27, "GOOG": 16, "CASH": 6},
                  "diversification_rating": "Poor",
                  "recommendation": "Heavy technology concentration (94%). High risk due to TSLA overweight at 27%. Reduce TSLA to 15% and add Financials/Healthcare.",
              },
              "PORT-003": {
                  "name": "Balanced Moderate",
                  "strategy": "moderate",
                  "total_value": 1000000,
                  "risk_score": 4.5,
                  "holdings": {"AAPL": 6, "MSFT": 11, "JPM": 11, "V": 12, "UNH": 16, "GS": 10, "GOOG": 6, "BRK-B": 13, "CASH": 15},
                  "diversification_rating": "Good",
                  "recommendation": "Well-balanced across sectors. Cash at 15% is slightly high. Deploy 5% into dividend equities for income.",
              },
              "PORT-004": {
                  "name": "High-Yield Dividend",
                  "strategy": "conservative",
                  "total_value": 300000,
                  "risk_score": 3.2,
                  "holdings": {"JPM": 22, "GS": 16, "V": 19, "UNH": 26, "BRK-B": 14, "CASH": 3},
                  "diversification_rating": "Good",
                  "recommendation": "Strong dividend focus. Low cash reserves at 3%. Maintain 5-10% cash for rebalancing opportunities.",
              },
              "PORT-005": {
                  "name": "Speculative Growth",
                  "strategy": "aggressive",
                  "total_value": 200000,
                  "risk_score": 9.1,
                  "holdings": {"TSLA": 62, "AMZN": 28, "CASH": 10},
                  "diversification_rating": "Very Poor",
                  "recommendation": "CRITICAL: Extreme concentration risk. 62% in single high-volatility stock (TSLA). Immediate rebalancing required. Max single-position should not exceed 25%.",
              },
          }

          def handler(event, context):
              portfolio_id = event.get("portfolio_id", "").upper()
              if portfolio_id in PORTFOLIOS:
                  portfolio = PORTFOLIOS[portfolio_id]
                  return {
                      "statusCode": 200,
                      "body": json.dumps({
                          "portfolio_id": portfolio_id,
                          "name": portfolio["name"],
                          "strategy": portfolio["strategy"],
                          "total_value": portfolio["total_value"],
                          "risk_score": portfolio["risk_score"],
                          "holdings_pct": portfolio["holdings"],
                          "diversification_rating": portfolio["diversification_rating"],
                          "recommendation": portfolio["recommendation"],
                      }),
                  }
              return {
                  "statusCode": 404,
                  "body": json.dumps({"error": f"No portfolio found for {portfolio_id}"}),
              }

  # ============================================================
  # Execute Trade Lambda Function (used in Lab 2 — Gateway, Lab 4 — Policies)
  # ============================================================

  ExecuteTradeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: workshop-trade-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ExecuteTradeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: workshop-execute-trade
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt ExecuteTradeLambdaRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import json

          KNOWN_TICKERS = [
              "AAPL", "MSFT", "JPM", "GS", "AMZN", "V", "UNH", "TSLA", "BRK-B", "GOOG",
          ]

          RESTRICTED_TICKERS = ["RESTRICTED-001", "RESTRICTED-002"]

          def handler(event, context):
              ticker = event.get("ticker", "").upper()
              quantity = event.get("quantity", 0)
              order_type = event.get("order_type", "market").lower()
              reason = event.get("reason", "")

              if ticker in RESTRICTED_TICKERS:
                  return {
                      "statusCode": 403,
                      "body": json.dumps({
                          "status": "rejected",
                          "ticker": ticker,
                          "reason": "Trading restricted for this security. Contact compliance for details.",
                      }),
                  }

              if ticker not in KNOWN_TICKERS:
                  return {
                      "statusCode": 404,
                      "body": json.dumps({
                          "status": "rejected",
                          "ticker": ticker,
                          "reason": f"Unknown ticker symbol '{ticker}'. Please verify and try again.",
                      }),
                  }

              if quantity > 10000:
                  return {
                      "statusCode": 400,
                      "body": json.dumps({
                          "status": "rejected",
                          "ticker": ticker,
                          "quantity": quantity,
                          "reason": "Order quantity exceeds maximum allowed (10,000 shares).",
                      }),
                  }

              if order_type == "limit":
                  return {
                      "statusCode": 200,
                      "body": json.dumps({
                          "status": "pending",
                          "ticker": ticker,
                          "quantity": quantity,
                          "order_type": "limit",
                          "reason": reason,
                          "message": "Limit order placed — awaiting price match.",
                          "settlement": "T+1 after execution",
                          "order_id": f"ORD-LMT-{ticker}-{quantity}",
                      }),
                  }

              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "status": "confirmed",
                      "ticker": ticker,
                      "quantity": quantity,
                      "order_type": "market",
                      "reason": reason,
                      "message": "Trade executed successfully.",
                      "settlement": "T+1",
                      "order_id": f"ORD-MKT-{ticker}-{quantity}",
                  }),
              }

  # ============================================================
  # SSM Parameters — Cognito
  # ============================================================

  CognitoMachineClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/client_id
      Type: String
      Value: !Ref MachineUserPoolClient
      Description: Machine Cognito client ID
      Tags:
        Application: PortfolioAdvisor
  
  CognitoWebClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/web_client_id
      Type: String
      Value: !Ref WebUserPoolClient
      Description: Cognito client ID for web app
      Tags:
        Application: PortfolioAdvisor

  UserPoolIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/pool_id
      Type: String
      Value: !Ref UserPool
      Description: Cognito client ID
      Tags:
        Application: PortfolioAdvisor
  
  CognitoAuthScopeParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/cognito_auth_scope
      Type: String
      Value: !Join
        - ''
        - - 'default-m2m-resource-server-'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          - '/read'
      Description: OAuth2 scope for Cognito auth
      Tags:
        Application: PortfolioAdvisor

  CognitoDiscoveryURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/cognito_discovery_url
      Type: String
      Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration'
      Description: OAuth2 Discovery URL
      Tags:
        Application: PortfolioAdvisor

  CognitoTokenURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/cognito_token_url
      Type: String
      Value: !Join
        - ''
        - - !Sub 'https://${AWS::Region}'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          - !Sub '.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
      Description: OAuth2 Token URL
      Tags:
        Application: PortfolioAdvisor

  CognitoAuthorizeURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/cognito_auth_url
      Type: String
      Value: !Join
        - ''
        - - !Sub 'https://${AWS::Region}'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          - !Sub '.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize'
      Description: OAuth2 Token URL
      Tags:
        Application: PortfolioAdvisor

  CognitoDomainParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/cognito_domain
      Type: String
      Value: !Join
        - ''
        - - !Sub 'https://${AWS::Region}'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          - !Sub '.auth.${AWS::Region}.amazoncognito.com'
      Description: Cognito hosted domain for OAuth2
      Tags:
        Application: PortfolioAdvisor

  # ============================================================
  # SSM Parameter — Portfolio Risk Lambda ARN (used in Lab 2)
  # ============================================================

  PortfolioRiskLambdaArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/portfolio_risk_lambda_arn
      Type: String
      Value: !GetAtt PortfolioRiskFunction.Arn
      Description: ARN of the portfolio risk check Lambda function for AgentCore Gateway
      Tags:
        Application: PortfolioAdvisor

  # ============================================================
  # SSM Parameter — Execute Trade Lambda ARN (used in Lab 2)
  # ============================================================

  ExecuteTradeLambdaArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/execute_trade_lambda_arn
      Type: String
      Value: !GetAtt ExecuteTradeFunction.Arn
      Description: ARN of the execute trade Lambda function for AgentCore Gateway
      Tags:
        Application: PortfolioAdvisor

  # ============================================================
  # AgentCore Harness pre-provisioning (de-risks the live labs)
  # ============================================================

  # Execution role the harness assumes at runtime (Lab 1+). Pre-created so
  # attendees never hit IAM issues on deploy. Permissions mirror the AgentCore
  # harness OAuth sample: Bedrock, InvokeGateway, OAuth2 token vault + secret,
  # workload identity, ECR Public image pull, logs, X-Ray, CW metrics.
  HarnessExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: workshop-harness-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: HarnessExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Bedrock
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*
              - Sid: Gateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*
              - Sid: OAuth2TokenVault
                Effect: Allow
                Action: bedrock-agentcore:GetResourceOauth2Token
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/oauth2credentialprovider/*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*
              - Sid: OAuth2Secret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/oauth2/*
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                Resource: '*'
              - Sid: EcrPublic
                Effect: Allow
                Action:
                  - ecr-public:GetAuthorizationToken
                  - sts:GetServiceBearerToken
                Resource: '*'
              - Sid: CloudWatch
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*
              - Sid: XRay
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
              - Sid: CWMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore

  # Gateway service role (Lab 2). Pre-created with Lambda invoke AND policy-engine
  # permissions so the Lab 3 policy-engine attachment succeeds without the manual
  # workaround. Attendees pass this role to `agentcore add gateway --role-arn`.
  GatewayServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: workshop-gateway-service-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GatewayServicePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeLambdaTargets
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt PortfolioRiskFunction.Arn
                  - !GetAtt ExecuteTradeFunction.Arn
              - Sid: PolicyEngineAuthorization
                Effect: Allow
                Action:
                  - bedrock-agentcore:CheckAuthorizePermissions
                  - bedrock-agentcore:IsAuthorized
                  - bedrock-agentcore:IsAuthorizedWithToken
                  - bedrock-agentcore:GetPolicyEngine
                Resource: '*'

  # OAuth2 (M2M client-credentials) credential provider in AgentCore Identity.
  # Pre-created so Lab 2 references its ARN instead of fishing the client secret
  # out of Cognito live. Created via a Lambda-backed custom resource because there
  # is no native CloudFormation type for it.
  CredentialProviderFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CredentialProviderManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreateOauth2CredentialProvider
                  - bedrock-agentcore:DeleteOauth2CredentialProvider
                  - bedrock-agentcore:GetOauth2CredentialProvider
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

  CredentialProviderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: workshop-create-credential-provider
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Role: !GetAtt CredentialProviderFunctionRole.Arn
      Code:
        ZipFile: |
          import boto3, cfnresponse

          NAME = "my-gateway-m2m"

          def lambda_handler(event, context):
              rt = event["RequestType"]
              props = event.get("ResourceProperties", {})
              region = props.get("Region")
              ac = boto3.client("bedrock-agentcore-control", region_name=region)
              try:
                  if rt == "Delete":
                      try:
                          ac.delete_oauth2_credential_provider(name=NAME)
                      except Exception as e:
                          print(f"delete (ignored): {e}")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  # Create / Update — idempotent
                  try:
                      existing = ac.get_oauth2_credential_provider(name=NAME)
                      arn = existing["credentialProviderArn"]
                  except Exception:
                      resp = ac.create_oauth2_credential_provider(
                          name=NAME,
                          credentialProviderVendor="CustomOauth2",
                          oauth2ProviderConfigInput={
                              "customOauth2ProviderConfig": {
                                  "oauthDiscovery": {"discoveryUrl": props["DiscoveryUrl"]},
                                  "clientId": props["ClientId"],
                                  "clientSecret": props["ClientSecret"],
                              }
                          },
                      )
                      arn = resp["credentialProviderArn"]
                  cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                   {"CredentialProviderArn": arn}, physicalResourceId=NAME)
              except Exception as e:
                  print(f"error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  GatewayM2MCredentialProvider:
    Type: Custom::OAuth2CredentialProvider
    DependsOn:
      - MachineUserPoolClient
      - UserPool
    Properties:
      ServiceToken: !GetAtt CredentialProviderFunction.Arn
      Region: !Ref AWS::Region
      DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration'
      ClientId: !Ref MachineUserPoolClient
      ClientSecret: !GetAtt MachineUserPoolClient.ClientSecret

  # ── SSM parameters for the pre-created harness resources (consumed in Labs 1–3) ──

  HarnessExecutionRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/harness_execution_role_arn
      Type: String
      Value: !GetAtt HarnessExecutionRole.Arn
      Description: Execution role ARN the harness assumes at runtime
      Tags:
        Application: PortfolioAdvisor

  GatewayServiceRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/gateway_service_role_arn
      Type: String
      Value: !GetAtt GatewayServiceRole.Arn
      Description: Gateway service role ARN (Lambda invoke + policy-engine attach)
      Tags:
        Application: PortfolioAdvisor

  GatewayM2MCredentialProviderArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/gateway_m2m_credential_provider_arn
      Type: String
      Value: !GetAtt GatewayM2MCredentialProvider.CredentialProviderArn
      Description: OAuth2 (M2M) credential provider ARN for outbound gateway auth
      Tags:
        Application: PortfolioAdvisor

  # ============================================================
  # VPC Resources (used in Lab 6 — VPC Integration)
  # ============================================================

  WorkshopVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-VPC
        - Key: Application
          Value: PortfolioAdvisor

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref WorkshopVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-Public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-Public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-Private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-Private-2

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-NAT

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkshopVPC
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-Public-RT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkshopVPC
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-Private-RT

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  AgentCoreSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for AgentCore VPC mode
      VpcId: !Ref WorkshopVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: PortfolioAdvisor-AgentCore-SG

  # VPC Endpoints for private connectivity
  AgentCoreVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-agentcore'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref AgentCoreSecurityGroup

  AgentCoreGatewayVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-agentcore.gateway'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref AgentCoreSecurityGroup

  BedrockRuntimeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref AgentCoreSecurityGroup

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  CloudWatchLogsVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref AgentCoreSecurityGroup

  ECRApiVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref AgentCoreSecurityGroup

  ECRDkrVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref AgentCoreSecurityGroup

  # ============================================================
  # SSM Parameters — VPC (used in Lab 6)
  # ============================================================

  VpcIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/vpc_id
      Type: String
      Value: !Ref WorkshopVPC
      Description: VPC ID for AgentCore VPC mode
      Tags:
        Application: PortfolioAdvisor

  PrivateSubnet1Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/private_subnet_1
      Type: String
      Value: !Ref PrivateSubnet1
      Description: Private subnet 1 for AgentCore VPC mode
      Tags:
        Application: PortfolioAdvisor

  PrivateSubnet2Parameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/private_subnet_2
      Type: String
      Value: !Ref PrivateSubnet2
      Description: Private subnet 2 for AgentCore VPC mode
      Tags:
        Application: PortfolioAdvisor

  SecurityGroupIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/portfolioadvisor/agentcore/security_group_id
      Type: String
      Value: !GetAtt AgentCoreSecurityGroup.GroupId
      Description: Security group ID for AgentCore VPC mode
      Tags:
        Application: PortfolioAdvisor
